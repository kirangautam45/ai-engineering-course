[project]
name = "ai-engineering-course"
version = "1.0.0"
description = "Free 45-day AI engineering course in Python: LLM APIs, prompt engineering, tool calling, embeddings and RAG"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.8",
    "python-dotenv>=1.0",
    # Week 3 onward: web APIs and MongoDB
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pymongo>=4.13",
    # Week 4 onward: calling other web APIs from tools
    "httpx>=0.27",
    # Week 5 onward: embeddings and reranking that run on your computer (no API key)
    "fastembed>=0.7",
    "numpy>=1.26",
    # Other providers (OpenAI, DeepSeek, Qwen, Ollama) and hosted embeddings
    "openai>=2.0",
    # Week 6 onward: reading PDFs, and file uploads in FastAPI
    "pypdf>=5.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# `pip install -e .` makes the shared helpers in ailib/ importable from every lesson
[tool.setuptools]
packages = ["ailib"]
